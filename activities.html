<section class="section"><div class="center"><span class="badge" id="levelBadge">GRADE ACTIVITY LAB</span><h2 id="pageTitle">Choose a Grade 🎓</h2><p class="sub" id="pageSub">Activities become harder as the grade increases. Select your grade below.</p></div><div class="grade-picker" id="gradePicker"></div><div id="activityArea"></div></section><footer><b style="color:#00e5ff">DK LEARNING</b><br><small>Learn • Read • Practice • Build • Score</small></footer><script src="fx.js"></script><script src="dk3d.js"></script><script src="app.js"></script><script>
const activities={
1:{level:'Starter',icon:'🌱',theme:'Computer & Digital World',intro:'Identify everyday technology and learn safe computer habits.',pdf:'pdf/grade-01-teaching.pdf',items:[['Which one shows pictures and words?',['Monitor','Keyboard','Mouse'],'Monitor'],['Which device helps us type?',['Keyboard','Speaker','Printer'],'Keyboard'],['Which one is used to hear sound?',['Speaker','Mouse','Scanner'],'Speaker'],['Should we share our password?',['Yes','No'],'No'],['What should you do after using a computer?',['Take care of it','Throw it','Hit it'],'Take care of it']]},
2:{level:'Starter+',icon:'🧩',theme:'Computer Parts & Safety',intro:'Sort basic computer parts and practise safe digital behaviour.',pdf:'pdf/grade-02-teaching.pdf',items:[['Which is an input device?',['Mouse','Monitor','Speaker'],'Mouse'],['Which is an output device?',['Printer','Keyboard','Mouse'],'Printer'],['What can store a file?',['USB drive','Chair','Headphones'],'USB drive'],['A strong password should be…',['easy to guess','private and hard to guess','your name'],'private and hard to guess'],['A strange message asks for your password.',['Tell a trusted adult','Send it','Post it'],'Tell a trusted adult']]},
3:{level:'Foundation',icon:'🔎',theme:'Digital Skills Challenge',intro:'Classify hardware, storage and safe internet actions.',pdf:'pdf/grade-03-teaching.pdf',items:[['Which pair are input devices?',['Keyboard + Mouse','Monitor + Speaker','Printer + Monitor'],'Keyboard + Mouse'],['Which is storage?',['SSD','Microphone','Monitor'],'SSD'],['What does a browser help you do?',['Visit websites','Wash the computer','Print clothes'],'Visit websites'],['Which is safest online?',['Keep personal details private','Share your address','Use the same password everywhere'],'Keep personal details private'],['Why do we save files?',['To keep our work','To make the screen dirty','To turn off Wi-Fi'],'To keep our work']]},
4:{level:'Developing',icon:'🛠️',theme:'Files, Hardware & Online Safety',intro:'Work with file types, hardware roles and safe browsing decisions.',pdf:'pdf/grade-04-teaching.pdf',items:[['Which device is mainly for permanent file storage?',['SSD','Keyboard','Webcam'],'SSD'],['Which file is likely an image?',['photo.jpg','music.mp3','notes.txt'],'photo.jpg'],['What is a folder used for?',['Organising files','Increasing volume','Typing faster'],'Organising files'],['A website asks for unnecessary personal data.',['Stop and check','Give everything','Share publicly'],'Stop and check'],['What does a backup help with?',['Recovering files','Making passwords public','Removing the keyboard'],'Recovering files']]},
5:{level:'Developing+',icon:'🧠',theme:'Productivity & Digital Citizenship',intro:'Solve practical tasks using files, documents and responsible online choices.',pdf:'pdf/grade-05-teaching.pdf',items:[['Which is best for a school report?',['Document editor','Calculator only','Music player'],'Document editor'],['Why use file names like Science_Project_01?',['Easy organisation','To hide malware','To slow the PC'],'Easy organisation'],['What should you do with a suspicious attachment?',['Verify before opening','Open immediately','Forward it'],'Verify before opening'],['What is plagiarism?',['Using others\' work as your own','Saving your own work','Formatting text'],'Using others\' work as your own'],['Which is a good digital habit?',['Cite sources','Copy everything','Share passwords'],'Cite sources']]},
6:{level:'Intermediate',icon:'⚙️',theme:'Networks & Problem Solving',intro:'Think about networks, troubleshooting and information security.',pdf:'pdf/grade-06-teaching.pdf',items:[['What connects devices on a local network?',['Network equipment','Printer ink','Keyboard keys'],'Network equipment'],['If a webpage will not load, what should you check first?',['Network connection','Screen colour','Speaker volume'],'Network connection'],['Which is an example of two-factor authentication?',['Password + code','Name only','Mouse + keyboard'],'Password + code'],['Why are software updates important?',['Security and fixes','They remove all files','They break the keyboard'],'Security and fixes'],['Which is safer on public Wi-Fi?',['Use secure connections','Share passwords','Disable all security'],'Use secure connections']]},
7:{level:'Advanced',icon:'💻',theme:'Algorithms & Programming',intro:'Build algorithmic thinking with logic, variables and simple programming.',pdf:'pdf/grade-07-teaching.pdf',items:[['What is an algorithm?',['A step-by-step procedure','A computer brand','A file type'],'A step-by-step procedure'],['Which is a variable?',['score = 50','print() only','keyboard'],'score = 50'],['What does an IF statement do?',['Makes a decision','Stores music','Draws hardware'],'Makes a decision'],['Which loop repeats instructions?',['for','title','input-device'],'for'],['What is debugging?',['Finding and fixing errors','Deleting the computer','Changing wallpaper'],'Finding and fixing errors']],code:'Write Python code that stores 10 in score and prints score.'},
8:{level:'Advanced+',icon:'🧪',theme:'Python & Data Logic',intro:'Use conditions, loops and data structures to solve small programming problems.',pdf:'pdf/grade-08-teaching.pdf',items:[['What does len("DK") return?',['2','1','0'],'2'],['Which creates a list?',['[1,2,3]','(1,2,3) only','{1,2,3} only'],'[1,2,3]'],['Which operator means equal in Python?',['==','=','=>'],'=='],['Why use functions?',['Reuse organised code','Make code invisible','Delete variables'],'Reuse organised code'],['What is a Boolean value?',['True or False','A decimal only','A file extension'],'True or False']],code:'Write a function called greet() that prints "Hello DK".'},
9:{level:'Problem Solver',icon:'🧩',theme:'Programming & Systems',intro:'Combine programming logic, data and system thinking in multi-step challenges.',pdf:'pdf/grade-09-teaching.pdf',items:[['What is the output of 3 * 4?',['12','7','34'],'12'],['Which structure is best for key-value pairs in Python?',['Dictionary','String','Float'],'Dictionary'],['What does a loop help with?',['Repetition','Only printing','Internet access'],'Repetition'],['Why validate user input?',['Prevent invalid data','Make data random','Delete the program'],'Prevent invalid data'],['Which is a cybersecurity principle?',['Least privilege','Share all passwords','Use no updates'],'Least privilege']],code:'Write Python code that prints numbers 1 to 5 using a loop.'},
10:{level:'O/L Foundation',icon:'📊',theme:'Data, Algorithms & Web',intro:'Apply structured problem solving to data, algorithms and web technologies.',pdf:'pdf/grade-10-teaching.pdf',items:[['Which structure stores ordered values?',['List','Boolean','Function name'],'List'],['What is complexity about?',['How resource use grows','Screen brightness','Keyboard layout'],'How resource use grows'],['Which HTML tag creates a paragraph?',['<p>','<img>','<br> only'],'<p>'],['Which CSS property changes text colour?',['color','font-file','text-data'],'color'],['Why normalise data?',['Reduce unnecessary duplication','Delete all data','Increase spelling errors'],'Reduce unnecessary duplication']],code:'Create a Python program that asks for a mark and prints Pass if mark >= 50, otherwise Fail.'},

13:{level:'A/L Project',icon:'🏆',theme:'Computational Thinking Capstone',intro:'Plan, design and implement a small ICT solution. Explain your choices like a developer.',pdf:'pdf/grade-13-teaching.pdf',items:[['What should come first in a software project?',['Requirements/problem definition','Random coding','Publishing immediately'],'Requirements/problem definition'],['Which design principle reduces duplicated code?',['Reuse/modularity','Copy-paste everywhere','Hard-code every value'],'Reuse/modularity'],['What is an edge case?',['An unusual boundary input','A normal username','A CSS colour'],'An unusual boundary input'],['Why document a program?',['To explain how it works','To hide errors','To remove testing'],'To explain how it works'],['A good solution should be evaluated against…',['Requirements and test cases','Only its colour','Only its title'],'Requirements and test cases']],code:'Capstone: design a small Python student-mark system with input, validation, average calculation, grade classification and a clear final report.'}
};
function getGrade(){const n=parseInt(new URLSearchParams(location.search).get('grade'));return n>=1&&n<=13?n:0}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderPicker(g){const p=document.getElementById('gradePicker');for(let i=1;i<=13;i++){const a=document.createElement('a');a.className='grade-chip '+(i===g?'selected':'');a.href='activities.html?grade='+i;a.textContent='Grade '+i;p.appendChild(a)}}
function renderActivity(g){const d=activities[g], area=document.getElementById('activityArea');document.getElementById('levelBadge').textContent='GRADE '+g+' • '+d.level.toUpperCase();document.getElementById('pageTitle').textContent='Grade '+g+' Activity Lab '+d.icon;document.getElementById('pageSub').textContent=d.intro+' Difficulty: '+d.level+'.';let html='<div class="activity" id="gradeActivity"><div class="activity-head"><div><span class="tag">GRADE '+g+' • '+esc(d.theme)+'</span><h3>'+d.icon+' '+esc(d.theme)+'</h3><p class="sub">Learn first, then solve all tasks. Your best score is saved for Grade '+g+'.</p></div><a class="btn ghost" href="'+d.pdf+'">📄 Teaching PDF</a></div><div class="level-box"><b>Level '+g+'</b><span>'+esc(d.level)+'</span><span>5 questions'+(d.code?' + coding task':'')+'</span></div>';
d.items.forEach((it,i)=>{html+='<div class="task"><b>Q'+(i+1)+'. '+esc(it[0])+'</b><div class="options" data-answer="'+esc(it[2])+'">'+it[1].map(o=>'<button class="option">'+esc(o)+'</button>').join('')+'</div></div>'});if(d.code)html+='<div class="task"><b>💻 Coding Challenge</b><p class="sub">'+esc(d.code)+'</p><textarea class="input codebox" id="codeAnswer" placeholder="Write your solution here..."></textarea></div>';html+='<button class="btn primary check" onclick="checkGradeActivity('+g+')">Check Activity</button> <button class="btn ghost" onclick="location.reload()">Retry</button><div class="result" id="gradeResult"></div></div><div class="note">📈 Grade progression: Grade 1–3 = digital foundations • Grade 4–6 = practical ICT • Grade 7–9 = programming & systems • Grade 10–11 = O/L level problem solving • Grade 12–13 = A/L/project-level thinking.</div><div class="buttons"><a class="btn ghost" href="lessons.html?grade='+g+'">📚 Grade '+g+' Lessons</a><a class="btn primary" href="grades.html">Choose Another Grade</a></div>';area.innerHTML=html;document.querySelectorAll('.option').forEach(o=>o.addEventListener('click',()=>{const box=o.parentElement;box.querySelectorAll('.option').forEach(x=>x.classList.remove('selected'));o.classList.add('selected')}))}
function checkGradeActivity(g){const d=activities[g],box=document.getElementById('gradeActivity'),groups=box.querySelectorAll('.options'),total=d.items.length+(d.code?1:0),coding=d.code?document.getElementById('codeAnswer').value.trim():'';let score=0;groups.forEach(gr=>{gr.querySelectorAll('.option').forEach(o=>o.classList.remove('correct','wrong'));const ch=gr.querySelector('.selected');if(ch){if(ch.textContent.trim()===gr.dataset.answer){ch.classList.add('correct');score++}else{ch.classList.add('wrong');gr.querySelectorAll('.option').forEach(o=>{if(o.textContent.trim()===gr.dataset.answer)o.classList.add('correct')})}}});if(d.code){const normalized=coding.toLowerCase().replace(/\s+/g,' ');let good=false;if(g<=9)good=normalized.includes('print')&&normalized.includes('for');else if(g===10)good=normalized.includes('if')&&normalized.includes('mark');else if(g===11)good=normalized.includes('largest')||normalized.includes('max');else if(g===12)good=normalized.includes('def')&&normalized.includes('average');else good=normalized.length>=80&&(/input|mark|grade|average|validation/i.test(normalized));if(good)score++}const pct=Math.round(score/total*100),r=document.getElementById('gradeResult');r.style.display='block';r.innerHTML='<div class="score">'+score+'/'+total+' • '+pct+'%</div><p>'+(pct===100?'🏆 Outstanding! You completed the Grade '+g+' challenge perfectly.':pct>=80?'🔥 Excellent work! You are ready for the next challenge.':pct>=60?'👍 Good progress. Review the teaching material and retry the harder questions.':'📚 Keep learning. Read the teaching material again and try the activity once more.')+'</p>';localStorage.setItem(DKAuth.k('dk_grade_'+g),score+'/'+total);updateGradeProgress(g)}
function updateGradeProgress(g){const r=document.getElementById('gradeResult');if(r&&!document.getElementById('gradeProgress')){const p=document.createElement('p');p.id='gradeProgress';p.innerHTML='💾 Best result saved on this device for Grade '+g+'.';r.appendChild(p)}}
const g=getGrade();renderPicker(g);if(g)renderActivity(g);else document.getElementById('activityArea').innerHTML='<div class="card center"><h3>Select your grade</h3><p class="sub">Choose Grade 1–13 above to open the correct difficulty level.</p></div>';
</script></body></html>
