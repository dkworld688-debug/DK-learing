<!DOCTYPE html>
<html lang="si">
<head>
    <meta name="referrer" content="no-referrer">
    <script src="auth.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevCraft Studio Pro - HTML 100 Masterclass</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0b0f19; --sidebar-bg: #111827; --panel-bg: #1f2937; --card-bg: #111827;
            --accent: #f59e0b; --accent-hover: #d97706; --text-main: #f3f4f6; --text-muted: #9ca3af;
            --border: #374151; --blue-badge: #0284c7;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        aside { width: 320px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100%; }
        .sidebar-header { padding: 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
        .logo-area { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; color: #fff; }
        .logo-area span { color: var(--accent); }
        .badge-student { background-color: #065f46; color: #34d399; font-size: 0.75rem; padding: 4px 10px; border-radius: 20px; font-weight: 600; }

        .progress-box { padding: 15px 20px; border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.02); }
        .progress-info { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 8px; color: var(--text-muted); }
        .progress-bar-bg { width: 100%; height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }

        .nav-list { flex: 1; overflow-y: auto; padding: 15px; }
        .nav-category { font-size: 0.75rem; font-weight: 700; color: var(--accent); margin: 15px 0 8px 10px; letter-spacing: 0.5px; }
        .nav-item { padding: 10px 12px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; color: var(--text-muted); transition: all 0.2s; margin-bottom: 4px; }
        .nav-item:hover { background-color: rgba(255,255,255,0.05); color: #fff; }
        .nav-item.active { background-color: var(--panel-bg); color: #fff; border-left: 4px solid var(--accent); font-weight: 600; }
        .nav-item.learned::after { content: '✓'; color: #34d399; font-weight: bold; }

        main { flex: 1; display: flex; flex-direction: column; height: 100%; overflow-y: auto; background-color: var(--bg-dark); padding: 25px; }
        .lesson-header { background: var(--panel-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .lesson-title-area h1 { font-size: 1.5rem; color: #fff; display: flex; align-items: center; gap: 10px; margin-bottom: 5px; }
        .lesson-title-area p { color: var(--text-muted); font-size: 0.95rem; }

        .btn { background: var(--accent); color: #111; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: var(--accent-hover); }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: #fff; }
        .btn-outline:hover { background: rgba(255,255,255,0.05); }

        .content-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .tag-badge { background: var(--blue-badge); color: #fff; padding: 4px 10px; border-radius: 6px; font-family: 'Fira Code', monospace; font-size: 0.9rem; display: inline-block; margin-bottom: 10px; }
        .section-title { font-size: 1.1rem; font-weight: 600; color: #fff; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .explanation-text { font-size: 1rem; line-height: 1.6; color: var(--text-main); margin-bottom: 15px; }
        .code-box { background: #090d16; border: 1px solid var(--border); border-radius: 6px; padding: 12px; font-family: 'Fira Code', monospace; font-size: 0.9rem; color: #38bdf8; margin-bottom: 15px; white-space: pre-wrap; word-break: break-all; }

        .workspace-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .workspace-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; overflow: hidden; }
        .workspace-panel-header { background: var(--panel-bg); padding: 10px 15px; font-size: 0.85rem; font-weight: 600; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        textarea.code-editor { width: 100%; height: 200px; background: #090d16; color: #f3f4f6; border: none; padding: 15px; font-family: 'Fira Code', monospace; font-size: 0.9rem; resize: none; outline: none; }
        .live-preview { background: #fff; color: #111; padding: 15px; height: 200px; overflow-y: auto; }

        .quiz-box { background: rgba(245, 158, 11, 0.05); border: 1px dashed var(--accent); border-radius: 8px; padding: 15px; margin-top: 15px; }
        .quiz-question { font-weight: 600; margin-bottom: 10px; color: #fbbf24; }
        .quiz-options { display: flex; flex-direction: column; gap: 8px; }
        .quiz-option { background: var(--panel-bg); border: 1px solid var(--border); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .quiz-option:hover { border-color: var(--accent); }
        .quiz-feedback { display: none; margin-top: 12px; padding: 10px 14px; border-radius: 6px; font-size: 0.95rem; font-weight: 600; animation: pop 0.25s ease; }
        .quiz-feedback.show { display: block; }
        .quiz-feedback.ok { background: rgba(6,95,70,0.35); border: 1px solid #34d399; color: #34d399; }
        .quiz-feedback.bad { background: rgba(127,29,29,0.35); border: 1px solid #f87171; color: #fca5a5; }
        .quiz-option.done { pointer-events: none; opacity: 0.85; }
        @keyframes pop { from { transform: scale(0.96); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .footer-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border); }

        @media (max-width: 800px) {
            body { flex-direction: column; height: auto; min-height: 100vh; overflow: auto; }
            aside { width: 100%; height: 260px; border-right: 0; border-bottom: 1px solid var(--border); }
            main { width: 100%; height: auto; overflow: visible; }
        }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-header">
            <div class="logo-area">⚡ DevCraft <span>Studio Pro</span></div>
            <div class="badge-student">Interactive</div>
        </div>
        <div class="progress-box">
            <div class="progress-info">
                <span>ප්‍රගතිය (Progress)</span>
                <span id="progress-text">0 / 100 Learned</span>
            </div>
            <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-bar"></div></div>
        </div>
        <div class="nav-list" id="nav-list"></div>
    </aside>

    <main>
        <div class="lesson-header">
            <div class="lesson-title-area">
                <h1 id="main-lesson-title"></h1>
                <p id="main-lesson-desc"></p>
            </div>
            <div>
                <button class="btn" id="mark-learned-btn" onclick="toggleLearned()">✅ Mark as Learned</button>
            </div>
        </div>

        <div class="content-card">
            <div class="tag-badge" id="display-tag-name"></div>
            <div class="section-title">සරල සිංහල පැහැදිලි කිරීම</div>
            <div class="explanation-text" id="display-explanation"></div>

            <div class="section-title">Syntax &amp; Usage</div>
            <div class="code-box" id="display-syntax"></div>

            <div class="quiz-box">
                <div class="quiz-question" id="quiz-q"></div>
                <div class="quiz-options" id="quiz-options"></div>
                <div class="quiz-feedback" id="quiz-feedback"></div>
            </div>
        </div>

        <div class="workspace-grid">
            <div class="workspace-panel">
                <div class="workspace-panel-header">
                    <span>💻 Edit HTML Code</span>
                    <span><button class="btn btn-outline" style="padding: 4px 10px; font-size: 0.75rem;" onclick="showExample()">💡 Example</button> <button class="btn" style="padding: 4px 10px; font-size: 0.75rem;" onclick="runCode()">▶ Run Code</button></span>
                </div>
                <textarea class="code-editor" id="code-editor-input" spellcheck="false" placeholder="ඔබම මෙතන code එක type කරන්න, ඉන්පසු ▶ Run Code ඔබන්න..."></textarea>
            </div>
            <div class="workspace-panel">
                <div class="workspace-panel-header"><span>📺 Live Output Canvas</span></div>
                <iframe sandbox="allow-scripts" class="live-preview" id="live-preview-frame" style="border:none; width:100%; height:200px;"></iframe>
            </div>
        </div>

        <div class="footer-nav">
            <button class="btn btn-outline" onclick="changeLesson(-1)">⬅ Previous Lesson</button>
            <span id="lesson-counter-footer" style="color: var(--text-muted); font-size: 0.9rem;">Lesson 1 of 100</span>
            <button class="btn btn-outline" onclick="changeLesson(1)">Next Lesson ➡</button>
        </div>
    </main>

    <script>
        // ===== Tags 1 - 20 =====
        const htmlTagsData = [
            { tag: "<!DOCTYPE html>", cat: "Document Setup", desc: "HTML5 Document එකක් බව Browser එකට දන්වයි.", syntax: "<!DOCTYPE html>", example: "<!DOCTYPE html>\n<html>\n  <head><title>Page</title></head>\n  <body>Hello</body>\n</html>", quiz: { q: "DOCTYPE tag එක ලියන්නේ කොහේද?", options: ["පිටුවේ අගට", "පිටුවේ මුලටම (Very first line)", "CSS ඇතුළට"], correct: 1 } },

            { tag: "<title>", cat: "Document Setup", desc: "Browser tab එකේ පෙනෙන පිටුවේ නම නිරූපණය කරයි.", syntax: "<title>Page Title</title>", example: "<title>My Portfolio</title>\n<p>Title shows in the browser tab</p>", quiz: { q: "Title tag එක තියෙන්නේ කොහේද?", options: ["<body> ඇතුළේ", "<head> ඇතුළේ", "<script> ඇතුළේ"], correct: 1 } },

            { tag: "<h1>", cat: "Headings & Typography", desc: "ප්‍රධානතම මාතෘකාව (Heading 1).", syntax: "<h1>Heading Text</h1>", example: "<h1>Welcome to my site</h1>", quiz: { q: "h1 යනු කුමක්ද?", options: ["කුඩාම අකුරු", "ප්‍රධාන මාතෘකාව", "ඡේදයක්"], correct: 1 } },
            { tag: "<h2>", cat: "Headings & Typography", desc: "දෙවන මට්ටමේ මාතෘකාව (Heading 2).", syntax: "<h2>Sub Heading</h2>", example: "<h2>About Us</h2>", quiz: { q: "h1 සහ h2 අතර වෙනස කුමක්ද?", options: ["h2 ප්‍රමාණයෙන් කුඩාය", "h2 වලට විකුණුම් කළ නොහැකිය", "කිසිදු වෙනසක් නැත"], correct: 0 } },
            { tag: "<h3>", cat: "Headings & Typography", desc: "තුන්වන මට්ටමේ මාතෘකාව (Heading 3).", syntax: "<h3>Section Heading</h3>", example: "<h3>Contact Details</h3>", quiz: { q: "h3 යනු කුමන මට්ටමේ heading එකක්ද?", options: ["3 වන මට්ටම", "ප්‍රධානම මාතෘකාව", "අවසාන මාතෘකාව"], correct: 0 } },

                ["var", "විචල්‍යයක් (Variable) දක්වයි.", '<p>Area = <var>w</var> x <var>h</var></p>'],
                ["wbr", "පේළිය කැඩිය හැකි ස්ථානයක්.", '<p style="width:80px">Super<wbr>cali<wbr>fragilistic</p>'],
                ["bdo", "පෙළ දිශාව වෙනස් කරයි.", '<p><bdo dir="rtl">Hello World</bdo></p>'],
                ["embed", "බාහිර අන්තර්ගතයක් (PDF / media) Embed කරයි.", '<embed src="file.pdf" width="200" height="100">']
            ]]
        ];

        // Build lessons 21-100 (80 tags)
        const extra = [];
        G.forEach(([cat, list]) => list.forEach(([t, d, e]) => extra.push({
            tag: `<${t}>`, cat: cat, desc: d, syntax: e, example: e
        })));

        // Auto quiz: correct answer = its own description, 2 distractors from other tags
        extra.forEach((x, i) => {
            const opts = [extra[(i + 7) % extra.length].desc, extra[(i + 13) % extra.length].desc];
            const pos = i % 3;
            opts.splice(pos, 0, x.desc);
            x.quiz = { q: `${x.tag} tag එකේ කාර්යය කුමක්ද?`, options: opts, correct: pos };
            htmlTagsData.push(x);
        });


        let currentLessonIndex = 0;
        let learnedLessons = [];
        try { learnedLessons = JSON.parse(localStorage.getItem(DKAuth.k('devcraft_learned')) || '[]'); } catch (e) {}
        function saveLearned() { try { localStorage.setItem(DKAuth.k('devcraft_learned'), JSON.stringify(learnedLessons)); } catch (e) {} }

        function initApp() {
            loadLesson(0);
            updateProgress();
        }

        function renderSidebar() {
            const navList = document.getElementById('nav-list');
            navList.innerHTML = '';
            let currentCat = '';
            htmlTagsData.forEach((item, index) => {
                if (item.cat !== currentCat) {
                    currentCat = item.cat;
                    const catHeader = document.createElement('div');
                    catHeader.className = 'nav-category';
                    catHeader.textContent = `${index + 1}. ${currentCat.toUpperCase()}`;
                    navList.appendChild(catHeader);
                }
                const navItem = document.createElement('div');
                navItem.className = `nav-item ${index === currentLessonIndex ? 'active' : ''} ${learnedLessons.includes(index) ? 'learned' : ''}`;
                navItem.textContent = item.tag;
                navItem.onclick = () => loadLesson(index);
                navList.appendChild(navItem);
            });
            const active = navList.querySelector('.nav-item.active');
            if (active) active.scrollIntoView({ block: 'nearest' });
        }

        function loadLesson(index) {
            currentLessonIndex = index;
            const data = htmlTagsData[index];
            const total = htmlTagsData.length;

            document.getElementById('main-lesson-title').textContent = `Lesson ${index + 1}: ${data.tag}`;
            document.getElementById('main-lesson-desc').textContent = data.desc;
            document.getElementById('display-tag-name').textContent = data.tag;
            document.getElementById('display-explanation').textContent = data.desc;
            document.getElementById('display-syntax').textContent = data.syntax;
            document.getElementById('code-editor-input').value = '';
            document.getElementById('lesson-counter-footer').textContent = `Lesson ${index + 1} of ${total}`;

            document.getElementById('quiz-q').textContent = `Quick Quiz: ${data.quiz.q}`;
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = '';
            showFeedback('', true);
            data.quiz.options.forEach((opt, oIdx) => {
                const optDiv = document.createElement('div');
                optDiv.className = 'quiz-option';
                optDiv.textContent = opt;
                optDiv.onclick = () => {
                    if (oIdx === data.quiz.correct) {
                        optDiv.style.background = '#065f46';
                        optDiv.style.borderColor = '#34d399';
                        optionsContainer.querySelectorAll('.quiz-option').forEach(o => o.classList.add('done'));
                        showFeedback('✅ නිවැරදියි! ඔබ මෙම පාඩම ඉගෙන ගත් ලෙස සලකුණු කළා 🎉', true);
                        markAsLearnedQuiet(index);
                    } else {
                        optDiv.style.background = '#7f1d1d';
                        optDiv.style.borderColor = '#f87171';
                        showFeedback('❌ වැරදියි, නැවත උත්සාහ කරන්න.', false);
                    }
                };
                optionsContainer.appendChild(optDiv);
            });

            const learnBtn = document.getElementById('mark-learned-btn');
            if (learnedLessons.includes(index)) {
                learnBtn.textContent = '✅ Learned';
                learnBtn.style.background = '#065f46';
                learnBtn.style.color = '#34d399';
            } else {
                learnBtn.textContent = '✅ Mark as Learned';
                learnBtn.style.background = 'var(--accent)';
                learnBtn.style.color = '#111';
            }

            runCode();
            renderSidebar();
        }

        function showFeedback(msg, ok) {
            const el = document.getElementById('quiz-feedback');
            el.textContent = msg;
            el.className = 'quiz-feedback' + (msg ? ' show ' + (ok ? 'ok' : 'bad') : '');
        }

        function showExample() {
            document.getElementById('code-editor-input').value = htmlTagsData[currentLessonIndex].example;
            runCode();
        }

        function runCode() {
            document.getElementById('live-preview-frame').srcdoc = document.getElementById('code-editor-input').value;
        }

        function toggleLearned() {
            if (learnedLessons.includes(currentLessonIndex)) {
                learnedLessons = learnedLessons.filter(i => i !== currentLessonIndex);
            } else {
                learnedLessons.push(currentLessonIndex);
            }
            saveLearned();
            loadLesson(currentLessonIndex);
            updateProgress();
        }

        function markAsLearnedQuiet(index) {
            if (!learnedLessons.includes(index)) {
                learnedLessons.push(index);
                saveLearned();
                updateProgress();
                renderSidebar();
            }
        }

        function updateProgress() {
            const total = htmlTagsData.length;
            const count = learnedLessons.length;
            document.getElementById('progress-text').textContent = `${count} / ${total} Learned`;
            document.getElementById('progress-bar').style.width = `${(count / total) * 100}%`;
        }

        function changeLesson(dir) {
            const n = currentLessonIndex + dir;
            if (n >= 0 && n < htmlTagsData.length) loadLesson(n);
        }

        window.onload = initApp;
    </script>
